spring.datasource.url=jdbc:mysql://localhost:3306/interview_prep_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:interviewprep}
spring.datasource.password=${DB_PASSWORD:interviewprep123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=InterviewPrepPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

spring.cache.type=simple

# spring.data.redis.host=localhost
# spring.data.redis.port=6379
# spring.data.redis.password=${REDIS_PASSWORD:redis123}
# spring.data.redis.timeout=2000ms

spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET:MySecretKeyForDevEnvironmentMinimum256BitsLongDefaultValueBecauseRequired}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# OpenAI
openai.api.key=${OPENAI_API_KEY:}
openai.model=gpt-3.5-turbo
openai.max-tokens=1000
openai.temperature=0.7
openai.base-url=https://api.openai.com/v1

# Hugging Face
huggingface.api.key=${HUGGINGFACE_API_KEY:}
huggingface.model-url=https://api-inference.huggingface.co/models/sentence-transformers/all-MiniLM-L6-v2

# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:3001

# Mail (for OTP and notifications)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
