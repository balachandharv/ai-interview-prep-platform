spring.application.name=interview-prep-backend
server.port=8080
server.servlet.context-path=/api

# ═══════════════════════════════════════
# MySQL Database
# ═══════════════════════════════════════
spring.datasource.url=jdbc:mysql://localhost:3306/interview_prep_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=BALARAMA007@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=InterviewPrepPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ═══════════════════════════════════════
# JPA / Hibernate
# ═══════════════════════════════════════
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ═══════════════════════════════════════
# Disable Redis (not needed for dev)
# ═══════════════════════════════════════
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# ═══════════════════════════════════════
# Flyway (disabled — using Hibernate ddl-auto)
# ═══════════════════════════════════════
spring.flyway.enabled=false

# ═══════════════════════════════════════
# JWT Security
# ═══════════════════════════════════════
jwt.secret=bXlTZWNyZXRLZXlGb3JEZXZFbnZpcm9ubWVudE1pbmltdW0yNTZCaXRzTG9uZ0RlZmF1bHRWYWx1ZUJlY2F1c2VSZXF1aXJlZA==
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ═══════════════════════════════════════
# Cache (simple in-memory, no Redis)
# ═══════════════════════════════════════
spring.cache.type=simple

# ═══════════════════════════════════════
# File Upload
# ═══════════════════════════════════════
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ═══════════════════════════════════════
# OpenAI / HuggingFace (optional, empty = mock mode)
# ═══════════════════════════════════════
openai.api.key=
openai.model=gpt-3.5-turbo
openai.max-tokens=1000
openai.temperature=0.7
openai.base-url=https://api.openai.com/v1
huggingface.api.key=
huggingface.model-url=https://api-inference.huggingface.co/models/sentence-transformers/all-MiniLM-L6-v2

# ═══════════════════════════════════════
# CORS
# ═══════════════════════════════════════
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ═══════════════════════════════════════
# Actuator
# ═══════════════════════════════════════
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ═══════════════════════════════════════
# Logging
# ═══════════════════════════════════════
logging.level.com.interviewprep=DEBUG
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n

# ═══════════════════════════════════════
# Server & Graceful Shutdown
# ═══════════════════════════════════════
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
