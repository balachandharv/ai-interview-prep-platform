version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: interviewai-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: interviewai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: interviewai-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interviewai-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=interviewai
      - DB_USER=postgres
      - DB_PASS=postgrespassword
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=8f7b3c2a9d1e4f6g8h0j2k4l6m8n0p2q4r6s8t0u2v4w6x8y0z_replace_in_prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: interviewai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
