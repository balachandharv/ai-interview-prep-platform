version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: interview_prep_db
    environment:
      MYSQL_DATABASE: interview_prep_db
      MYSQL_USER: ${DB_USERNAME:-balarama}
      MYSQL_PASSWORD: ${DB_PASSWORD:-BALARAMA007@}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-BALARAMA007@}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: interview_prep_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interview_prep_backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_USERNAME: ${DB_USERNAME:-interviewprep}
      DB_PASSWORD: ${DB_PASSWORD:-interviewprep123}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: interview_prep_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
